services:
  f1tele:
    build:
      context: .
      args:
        VERSION: ${F1TELE_IMAGE_VERSION:-local}
        REVISION: ${F1TELE_IMAGE_REVISION:-unknown}
    image: f1tele:local
    init: true
    ports:
      - "8081:8081/tcp"
      - "20777:20777/udp"
    volumes:
      - f1tele-data:/data
    environment:
      F1TELE_HTTP_ADDR: 0.0.0.0:8081
      F1TELE_UDP_ADDR: 0.0.0.0:20777
      # Host a game on another machine should send telemetry to. Set this to
      # the Docker host's LAN address; Settings shows it as the address to enter.
      F1TELE_UDP_ADVERTISE_HOST: ${F1TELE_UDP_ADVERTISE_HOST:-}
      F1TELE_RECORDING_ENABLED: ${F1TELE_RECORDING_ENABLED:-}
      F1TELE_RECORDING_CAP_BYTES: ${F1TELE_RECORDING_CAP_BYTES:-}
      F1TELE_RECORDING_FREE_RESERVE_BYTES: ${F1TELE_RECORDING_FREE_RESERVE_BYTES:-}
      F1TELE_RECORDING_CHUNK_BYTES: ${F1TELE_RECORDING_CHUNK_BYTES:-}
      F1TELE_RECORDING_ROTATE_BYTES: ${F1TELE_RECORDING_ROTATE_BYTES:-}
      F1TELE_RECORDING_CHUNK_FLUSH_MS: ${F1TELE_RECORDING_CHUNK_FLUSH_MS:-}
      F1TELE_AGENT_ENABLED: ${F1TELE_AGENT_ENABLED:-}
      F1TELE_AGENT_ENDPOINT_ID: ${F1TELE_AGENT_ENDPOINT_ID:-}
      F1TELE_AGENT_BASE_URL: ${F1TELE_AGENT_BASE_URL:-}
      F1TELE_AGENT_MODEL: ${F1TELE_AGENT_MODEL:-}
      F1TELE_AGENT_PROTOCOL: ${F1TELE_AGENT_PROTOCOL:-}
      F1TELE_AGENT_API_KEY: ${F1TELE_AGENT_API_KEY:-}
      F1TELE_SEARCH_PROVIDER: ${F1TELE_SEARCH_PROVIDER:-}
      F1TELE_SEARCH_BASE_URL: ${F1TELE_SEARCH_BASE_URL:-}
      F1TELE_SEARCH_API_KEY: ${F1TELE_SEARCH_API_KEY:-}
      F1TELE_VOICE_ENABLED: ${F1TELE_VOICE_ENABLED:-}
      F1TELE_VOICE_BASE_URL: ${F1TELE_VOICE_BASE_URL:-}
      F1TELE_VOICE_TRANSCRIPTION_MODEL: ${F1TELE_VOICE_TRANSCRIPTION_MODEL:-}
      F1TELE_VOICE_TRANSCRIPTION_API_KEY: ${F1TELE_VOICE_TRANSCRIPTION_API_KEY:-}
      F1TELE_VOICE_SPEECH_MODEL: ${F1TELE_VOICE_SPEECH_MODEL:-}
      F1TELE_VOICE_SPEECH_API_KEY: ${F1TELE_VOICE_SPEECH_API_KEY:-}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  f1tele-data:

