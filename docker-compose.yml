services:
  f1:
    image: ghcr.io/sechmachine727/f1:latest
    build:
      context: .
      # Bake a fixed WebSocket endpoint into the UI instead of deriving it at
      # runtime from the browser's hostname:
      # args:
      #   VITE_WS_URL: ws://192.168.1.50:8765
    env_file:
      - path: .env
        required: false
    ports:
      - "20777:20777/udp"   # F1 25 telemetry in
      - "8765:8765"         # telemetry WebSocket out
      - "8081:8081"         # Race Engineer Hub dashboard
    volumes:
      - ./registries:/app/registries
      - ./mcp:/app/mcp
      - ./toolbox:/app/toolbox
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    # Telemetry-only, no LLM calls:
    # command: ["--no-agents"]
    # Replay a captured session:
    # command: ["--replay", "/app/data/session.f1bin", "--speed", "10x"]
