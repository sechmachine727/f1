services:
  f1tele:
    build: .
    image: f1tele:local
    ports:
      - "8081:8081/tcp"
      - "20777:20777/udp"
    volumes:
      - f1tele-data:/data
    environment:
      F1TELE_HTTP_ADDR: 0.0.0.0:8081
      F1TELE_UDP_ADDR: 0.0.0.0:20777
    restart: unless-stopped
volumes:
  f1tele-data:
